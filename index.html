        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();

          var origDefineProperty = Object.defineProperty;

            if ((obj === window || obj === globalThis || obj === self) && prop === 'fetch') {

                  get: function() {
                    if (currentVal !== undefined) return currentVal;
                    return typeof descriptor.get === 'function' ? descriptor.get() : descriptor.value;
                  },
                  set: function(val) {
                    currentVal = val;
                    if (typeof descriptor.set === 'function') {

                return origDefineProperty.call(Object, obj, prop, patchedDesc);

            var origReflectDefineProperty = Reflect.defineProperty;
            Reflect.defineProperty = function(obj, prop, descriptor) {

                return Object.defineProperty(obj, prop, descriptor);
              }
              return origReflectDefineProperty.apply(Reflect, arguments);
            };
          }

          var initialDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (initialDesc && initialDesc.configurable && (!initialDesc.set || !initialDesc.writable)) {
            var initialVal;
            origDefineProperty.call(Object, window, 'fetch', {
              get: function() {
                if (initialVal !== undefined) return initialVal;
                return initialDesc.get ? initialDesc.get() : initialDesc.value;
              },
              set: function(newVal) {
                initialVal = newVal;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
